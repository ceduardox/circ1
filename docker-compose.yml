version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: circulodb
    environment:
      POSTGRES_USER: ${DB_USER:-circulo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-circulo123}
      POSTGRES_DB: ${DB_NAME:-circulo1}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-circulo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: circulo-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-circulo}:${DB_PASSWORD:-circulo123}@postgres:5432/${DB_NAME:-circulo1}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: circulo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: